bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigato/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4
      movement_time_allowance: 12.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      motion_model: "DiffDrive"

      vx_max: 1.8
      vx_min: -0.5 #TODO: likely increase
      vy_max: 0.0
      wz_max: 1.2
      ax_max: 1.8
      ax_min: -1.8
      ay_max: 0.0
      az_max: 2.0

      vx_std: 0.25
      vy_std: 0.0
      wz_std: 0.25

      prune_distance: 2.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic",
        "VelocityDeadbandCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 2.0

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

      VelocityDeadbandCritic:
        enabled: true
        cost_weight: 20.0
        cost_power: 1
        deadband_velocities: [0.05, 0.0, 0.05]

global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_link
      footprint: "[[0.33, 0.51], [0.33, -0.51], [-0.33, -0.51], [-0.33, 0.51]]" #TODO tune for size
      footprint_padding: 0.03
      resolution: 0.05
      transform_tolerance: 0.5
      global_frame: map
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 30
      height: 30
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
    
      obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          footprint_clearing_enabled: true
          combination_method: 1
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 8.0
            raytrace_min_range: 0.25
            obstacle_max_range: 6.0
            obstacle_min_range: 0.25
            inf_is_valid: true

      inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: true
          inflation_radius: 0.75
          cost_scaling_factor: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_link
      footprint: "[[0.33, 0.51], [0.33, -0.51], [-0.33, -0.51], [-0.33, 0.51]]" #TODO tune for size
      footprint_padding: 0.03
      resolution: 0.05
      transform_tolerance: 0.5
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      rolling_window: true
      width: 8
      height: 8
      use_sim_time: false
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        combination_method: 1
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.25
          obstacle_max_range: 6.0
          obstacle_min_range: 0.25
          inf_is_valid: true

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        footprint_clearing_enabled: true
        max_obstacle_height: 1.5
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: lanes
        combination_method: 1
        lanes:
          topic: /lanes/points
          max_obstacle_height: 0.30
          min_obstacle_height: -0.05
          clearing: false
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.3

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.75
        cost_scaling_factor: 2.0

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [1.8, 0.0, 1.2] #TODO: should match other velocities (format is x,y,w)
    min_velocity: [-0.5, 0.0, -1.2]
    max_accel: [1.8, 0.0, 2.0]
    max_decel: [-1.8, 0.0, -2.0]
    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0
    odom_topic: /odometry/local
    odom_duration: 0.1
    use_realtime_priority: false
    stamp_smoothed_velocity_with_smoothing_time: false
  
collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom

    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /nav2/cmd_vel
    state_topic: collision_monitor_state

    transform_tolerance: 0.5
    source_timeout: 0.5
    stop_pub_timeout: 0.5
    base_shift_correction: true
    use_realtime_priority: false

    polygons: ["PolygonStop"]

    PolygonStop:
      type: "polygon"
      points: "[[0.58, 0.40], [0.58, -0.40], [-0.58, -0.40], [-0.58, 0.40]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

    observation_sources: ["scan"]
    scan:
      topic: /scan
      max_obstacle_height: 2.0
      clearing: true
      marking: true
      data_type: "LaserScan"
      raytrace_max_range: 8.0
      raytrace_min_range: 0.25
      obstacle_max_range: 6.0
      obstacle_min_range: 0.25
      inf_is_valid: true
